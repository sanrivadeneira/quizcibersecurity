<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberQuiz · 320 preguntas de Ciberseguridad</title>
<style>
  :root{
    --bg:#050b14;--panel:#0d1524;--panel2:#152238;--txt:#e6f0ff;
    --muted:#8aa0c0;--line:#1f2f47;--accent:#22d3ee;--ok:#22c55e;
    --bad:#ef4444;--warn:#f59e0b;--gold:#f4c430;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#0a2540 0%,var(--bg) 55%);
    color:var(--txt);min-height:100vh;display:flex;justify-content:center;
    padding:24px 16px 60px;
  }
  .app{width:100%;max-width:940px}
  .marca{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .logo{width:52px;height:52px;border-radius:15px;
    background:linear-gradient(135deg,#22d3ee,#6366f1);
    display:grid;place-items:center;font-size:26px;
    box-shadow:0 8px 28px rgba(34,211,238,.35)}
  .marca h1{font-size:1.15rem}.marca p{font-size:.76rem;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:22px;margin-bottom:16px}
  h2.titulo{font-size:1.02rem;margin-bottom:6px}
  p.sub{color:var(--muted);font-size:.85rem;line-height:1.5}
  .grid-temas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:10px;margin-top:16px}
  .tema-btn{background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;padding:14px;text-align:left;cursor:pointer;
    color:var(--txt);transition:.18s;font-family:inherit;font-size:.85rem}
  .tema-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
  .tema-btn .nom{font-weight:700;font-size:.9rem;display:block;margin-bottom:3px}
  .tema-btn .cant{font-size:.7rem;color:var(--muted)}
  .btn{font-family:inherit;font-size:.92rem;font-weight:600;
    border:none;border-radius:11px;padding:13px 20px;cursor:pointer;transition:.18s}
  .btn.principal{background:linear-gradient(135deg,#22d3ee,#6366f1);
    color:#02131c;width:100%;margin-top:14px;box-shadow:0 8px 22px rgba(34,211,238,.25)}
  .btn.principal:hover{filter:brightness(1.1)}
  .btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .btn.gold{background:linear-gradient(135deg,#f4c430,#f59e0b);color:#2a1c00;
    box-shadow:0 8px 22px rgba(244,196,48,.28);width:100%;margin-top:14px;font-weight:700}
  .btn.gold:hover{filter:brightness(1.08)}
  .barra-sup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-bottom:12px;font-size:.8rem}
  .badge{padding:4px 11px;border-radius:999px;font-weight:700;font-size:.68rem;
    letter-spacing:.4px;background:#16233a;border:1px solid var(--line)}
  .b-Fundamentos{color:#67e8f9;background:rgba(34,211,238,.15);border-color:rgba(34,211,238,.4)}
  .b-Criptografia{color:#d8b4fe;background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.4)}
  .b-Redes{color:#93c5fd;background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.4)}
  .b-Web{color:#f9a8d4;background:rgba(236,72,153,.15);border-color:rgba(236,72,153,.4)}
  .b-Malware{color:#fca5a5;background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4)}
  .b-Autenticacion{color:#86efac;background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4)}
  .b-Cloud{color:#fcd34d;background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4)}
  .b-Incidentes{color:#5eead4;background:rgba(20,184,166,.15);border-color:rgba(20,184,166,.4)}
  .b-Movil{color:#c4b5fd;background:rgba(139,92,246,.15);border-color:rgba(139,92,246,.4)}
  .b-IoT{color:#fbbf24;background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.4)}
  .b-Social{color:#fda4af;background:rgba(244,63,94,.15);border-color:rgba(244,63,94,.4)}
  .b-Cumplimiento{color:#7dd3fc;background:rgba(14,165,233,.15);border-color:rgba(14,165,233,.4)}
  .b-Fisica{color:#a7f3d0;background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4)}
  .b-Vulnerabilidades{color:#fecaca;background:rgba(220,38,38,.15);border-color:rgba(220,38,38,.4)}
  .b-DevSecOps{color:#c7d2fe;background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4)}
  .b-Blockchain{color:#fdba74;background:rgba(249,115,22,.15);border-color:rgba(249,115,22,.4)}
  .contador{color:var(--muted)}.puntos{margin-left:auto;font-weight:700;color:var(--ok)}
  .progreso{height:7px;background:#0a1220;border-radius:999px;overflow:hidden;
    margin-bottom:20px;border:1px solid var(--line)}
  .progreso > div{height:100%;background:linear-gradient(90deg,#22d3ee,#6366f1);
    transition:width .3s}
  .pregunta{font-size:1.08rem;line-height:1.5;margin-bottom:18px;font-weight:600}
  .opciones{display:flex;flex-direction:column;gap:9px}
  .opcion{display:flex;align-items:center;gap:12px;background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;
    color:var(--txt);font-family:inherit;font-size:.9rem;
    text-align:left;cursor:pointer;transition:.15s}
  .opcion:hover:not(:disabled){border-color:var(--accent);background:#1c2e4a}
  .letra{width:26px;height:26px;flex:0 0 26px;border-radius:7px;
    background:#0a1220;display:grid;place-items:center;
    font-weight:700;font-size:.74rem;color:var(--muted)}
  .opcion.correcta{background:rgba(34,197,94,.14);border-color:var(--ok)}
  .opcion.correcta .letra{background:var(--ok);color:#04210f}
  .opcion.incorrecta{background:rgba(239,68,68,.14);border-color:var(--bad)}
  .opcion.incorrecta .letra{background:var(--bad);color:#2b0606}
  .opcion.apagada{opacity:.5}
  .feedback{margin-top:14px;padding:13px 15px;border-radius:11px;
    font-size:.83rem;line-height:1.5;border:1px solid}
  .feedback.ok{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.45)}
  .feedback.mal{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.45)}
  .feedback b{display:block;margin-bottom:3px}
  .resultado-hero{text-align:center;padding:12px 0 4px}
  .estado-final{font-size:2rem;font-weight:800;letter-spacing:1px;margin-bottom:4px}
  .aprobado{color:var(--ok)}.reprobado{color:var(--bad)}
  .puntaje-grande{font-size:3.2rem;font-weight:800;line-height:1}
  .puntaje-grande small{font-size:1rem;color:var(--muted);font-weight:600}
  .nota{color:var(--muted);font-size:.84rem;margin-top:6px}
  .barra-resultado{height:13px;background:#0a1220;border-radius:999px;
    overflow:hidden;margin:16px 0 6px;border:1px solid var(--line);position:relative}
  .barra-resultado > div{height:100%;transition:width .6s}
  .meta-linea{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn)}
  .desglose{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .fila-tema{display:flex;align-items:center;gap:10px;font-size:.78rem}
  .fila-tema .nombre{width:118px;font-weight:700}
  .fila-tema .barra{flex:1;height:7px;background:#0a1220;border-radius:999px;overflow:hidden}
  .fila-tema .barra > div{height:100%}
  .fila-tema .valores{width:52px;text-align:right;color:var(--muted)}
  .revision{max-height:400px;overflow-y:auto;padding-right:6px;margin-top:6px}
  .rev-item{border-left:3px solid var(--bad);background:var(--panel2);
    border-radius:0 11px 11px 0;padding:11px 13px;margin-bottom:9px;
    font-size:.81rem;line-height:1.5}
  .rev-item.bien{border-left-color:var(--ok)}
  .rev-item .p{font-weight:600;margin-bottom:5px}
  .rev-item .r{color:#fca5a5}.rev-item .r.ok{color:#86efac}
  .rev-item .ex{color:var(--muted);font-size:.76rem;margin-top:4px}
  .acciones{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .acciones .btn{flex:1;min-width:140px}
  .toggle{display:flex;align-items:center;gap:8px;font-size:.8rem;
    color:var(--muted);margin-top:12px;cursor:pointer}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
  /* Formulario aprobación */
  .form-aprob{display:flex;flex-direction:column;gap:12px;margin-top:16px}
  .form-aprob label{font-size:.76rem;color:var(--muted);font-weight:600;
    display:block;margin-bottom:5px}
  .form-aprob input{width:100%;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;color:var(--txt);
    font-family:inherit;font-size:.92rem;transition:.15s}
  .form-aprob input:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(34,211,238,.15)}
  .status{padding:12px 14px;border-radius:10px;font-size:.85rem;margin-top:12px;
    border:1px solid;display:none}
  .status.show{display:block}
  .status.ok{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.5);color:#86efac}
  .status.err{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.5);color:#fca5a5}
  .status.info{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.5);color:#93c5fd}
  .link-box{background:#0a1220;border:1px dashed var(--accent);border-radius:10px;
    padding:14px;margin-top:14px;word-break:break-all;font-size:.8rem;
    color:#67e8f9;font-family:monospace}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:#0a1220}
  ::-webkit-scrollbar-thumb{background:#263a56;border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <div class="marca">
    <div class="logo">🛡️</div>
    <div>
      <h1>CyberQuiz · 320 preguntas</h1>
      <p>16 subtemas · 20 preguntas cada uno · aprueba con 70% y obtén tu certificado</p>
    </div>
  </div>
  <main id="app"></main>
</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const TOTAL_EXAMEN    = 100;
const PORC_APROBACION = 0.70;

/* URL de la APP 2 (Certificados). Cámbiala si las separas en otra carpeta */
const CERT_URL = 'cert.html';

/* Email del administrador (FormSubmit) */
const ADMIN_EMAIL = 'info.rsasystems@gmail.com';

/* =========================================================
   BANCO — 320 preguntas · 16 subtemas × 20
   ========================================================= */
const BANCO = [
/* ============ 1) FUNDAMENTOS (20) ============ */
{t:"Fundamentos",p:"¿Qué representa la 'C' de la tríada CIA?",o:["Control","Confidencialidad","Certificado","Contingencia"],c:1,e:"CIA = Confidencialidad, Integridad, Disponibilidad."},
{t:"Fundamentos",p:"¿Qué garantiza la Integridad en la tríada CIA?",o:["Que los datos no sean alterados sin autorización","Que estén siempre disponibles","Que sean públicos","Que estén cifrados"],c:0,e:"Evita modificaciones no autorizadas."},
{t:"Fundamentos",p:"¿Qué garantiza la Disponibilidad?",o:["Cifrado","Acceso cuando se necesita","Autenticación","Borrado de logs"],c:1,e:"Los sistemas deben estar accesibles."},
{t:"Fundamentos",p:"¿Qué significa AAA en seguridad?",o:["Audit, Alert, Action","Authentication, Authorization, Accounting","Access, Allow, Accept","Analyze, Assess, Apply"],c:1,e:"Autenticación, Autorización, Auditoría."},
{t:"Fundamentos",p:"¿Qué es el 'no repudio'?",o:["No poder negar haber realizado una acción","No cifrar datos","No usar contraseñas","No acceder al sistema"],c:0,e:"Garantiza la autoría de una acción."},
{t:"Fundamentos",p:"¿Qué es una vulnerabilidad?",o:["Un ataque","Una debilidad explotable","Un antivirus","Un firewall"],c:1,e:"Debilidad que puede ser explotada."},
{t:"Fundamentos",p:"¿Diferencia entre amenaza y vulnerabilidad?",o:["Son iguales","Amenaza=agente; vulnerabilidad=debilidad","Amenaza=debilidad","Ambas son físicas"],c:1,e:"La amenaza explota la vulnerabilidad."},
{t:"Fundamentos",p:"¿Qué es el riesgo en seguridad?",o:["Probabilidad de ataque","Probabilidad × Impacto","Impacto económico","Un malware"],c:1,e:"Riesgo = P × I."},
{t:"Fundamentos",p:"¿Qué es defensa en profundidad?",o:["Un solo control fuerte","Múltiples capas de controles","Solo cifrar","Solo firewall"],c:1,e:"Capas superpuestas de seguridad."},
{t:"Fundamentos",p:"¿Qué es mínimo privilegio?",o:["Todos los permisos","Solo los permisos necesarios","Ningún permiso","Rotar permisos"],c:1,e:"Least privilege."},
{t:"Fundamentos",p:"¿Qué es 'need to know'?",o:["Todos saben todo","Acceso solo a lo necesario","Saber solo la contraseña","Conocer al atacante"],c:1,e:"Acceso limitado por función."},
{t:"Fundamentos",p:"¿Qué es una superficie de ataque?",o:["Zona física","Puntos por donde un atacante puede entrar","El antivirus","El cortafuegos"],c:1,e:"Reducirla es fundamental."},
{t:"Fundamentos",p:"¿Qué es un control preventivo?",o:["Detecta","Evita que ocurra","Corrige después","Audita después"],c:1,e:"Firewall, contraseñas, cifrado."},
{t:"Fundamentos",p:"¿Qué es un control detectivo?",o:["Evita","Detecta cuando ocurre","Borra","Audita al final"],c:1,e:"IDS, antivirus, logs."},
{t:"Fundamentos",p:"¿Qué es un control correctivo?",o:["Evita","Detecta","Corrige el daño tras el incidente","Solo audita"],c:2,e:"Backups, restauración, parches."},
{t:"Fundamentos",p:"¿Qué es el 'modelo Bell-LaPadula'?",o:["Integridad","Confidencialidad multinivel","Disponibilidad","Autenticación"],c:1,e:"No read up, no write down."},
{t:"Fundamentos",p:"¿Qué es el 'modelo Biba'?",o:["Confidencialidad","Integridad multinivel","Disponibilidad","Autenticación"],c:1,e:"No read down, no write up."},
{t:"Fundamentos",p:"¿Qué es un SOC?",o:["Security Operations Center","System Operation Control","Secure Online Center","Software Open Code"],c:0,e:"Monitorea y responde 24/7."},
{t:"Fundamentos",p:"¿Qué es un 'zero day'?",o:["Día sin incidentes","Vulnerabilidad sin parche","Ataque anunciado","Auditoría"],c:1,e:"Sin parche disponible."},
{t:"Fundamentos",p:"¿Qué significa STRIDE?",o:["Spoofing, Tampering, Repudiation, Info disclosure, DoS, Elevation","Secure, Trust, Risk, Identify, Detect, Evaluate","Simple, Trusted, Robust, Isolated, Distributed, Encrypted","Scan, Test, Respond, Investigate, Defend, Eliminate"],c:0,e:"Marco de clasificación de amenazas."},

/* ============ 2) CRIPTOGRAFÍA (20) ============ */
{t:"Criptografia",p:"¿Qué hace la criptografía simétrica?",o:["Clave para cifrar y otra para descifrar","Misma clave para cifrar y descifrar","Sin claves","Solo firma"],c:1,e:"Misma clave."},
{t:"Criptografia",p:"¿Qué usa la criptografía asimétrica?",o:["Una sola clave","Par de claves pública/privada","Sin claves","Solo hash"],c:1,e:"Par de claves."},
{t:"Criptografia",p:"¿Cuál es el algoritmo simétrico más usado?",o:["DES","AES","RSA","MD5"],c:1,e:"AES es el estándar."},
{t:"Criptografia",p:"¿Qué tamaño de clave AES se considera seguro?",o:["32 bits","64 bits","128+ bits","8 bits"],c:2,e:"AES-128, 192, 256."},
{t:"Criptografia",p:"¿Qué algoritmo simétrico está obsoleto?",o:["AES","DES","ChaCha20","Blowfish"],c:1,e:"DES (56 bits)."},
{t:"Criptografia",p:"¿Qué algoritmo asimétrico es el más usado?",o:["RSA","AES","MD5","SHA-1"],c:0,e:"RSA."},
{t:"Criptografia",p:"¿Qué curva elíptica es común moderna?",o:["P-256","AES-256","SHA-2","DES-X"],c:0,e:"ECC P-256."},
{t:"Criptografia",p:"¿Qué es una función hash?",o:["Cifra reversible","Valor fijo irreversible","Genera claves","Autentica"],c:1,e:"Huella digital."},
{t:"Criptografia",p:"¿Qué algoritmo hash es seguro hoy?",o:["MD5","SHA-1","SHA-256","CRC32"],c:2,e:"MD5 y SHA-1 rotos."},
{t:"Criptografia",p:"¿Por qué MD5 no se recomienda?",o:["Lento","Colisiones conocidas","Usa clave","Asimétrico"],c:1,e:"Colisiones prácticas."},
{t:"Criptografia",p:"¿Propiedad de un hash criptográfico?",o:["Reversible","Resistente a colisiones","Usa clave","Lento"],c:1,e:"Colisiones, preimagen."},
{t:"Criptografia",p:"¿Qué es una firma digital?",o:["Escaneo","Hash cifrado con clave privada","Certificado","Sello"],c:1,e:"Autenticidad e integridad."},
{t:"Criptografia",p:"¿Qué es un certificado digital?",o:["Archivo de texto","Documento firmado por una CA","Hash","Token"],c:1,e:"Vincula identidad y clave pública."},
{t:"Criptografia",p:"¿Qué es una CA?",o:["Antivirus","Emite y firma certificados","Algoritmo","Firewall"],c:1,e:"Certificate Authority."},
{t:"Criptografia",p:"¿Qué es TLS?",o:["Protocolo de cifrado","Hash","Antivirus","Firewall"],c:0,e:"Transport Layer Security."},
{t:"Criptografia",p:"¿Qué versión TLS está obsoleta?",o:["TLS 1.3","TLS 1.2","TLS 1.0/1.1","TLS 1.4"],c:2,e:"Deprecadas."},
{t:"Criptografia",p:"¿Qué es Perfect Forward Secrecy?",o:["Reutilizar clave","Compromiso de clave a largo plazo no afecta sesiones pasadas","Hash","Certificado"],c:1,e:"Claves efímeras."},
{t:"Criptografia",p:"¿Qué es el intercambio Diffie-Hellman?",o:["Hash","Acordar clave sobre canal inseguro","Cifrado simétrico","Firma"],c:1,e:"Acordar clave sin transmitirla."},
{t:"Criptografia",p:"¿Qué es 'salting'?",o:["Valor aleatorio único antes del hash","Cifrar con AES","Usar MD5","Comprimir"],c:0,e:"Impide rainbow tables."},
{t:"Criptografia",p:"¿Algoritmo específico para contraseñas?",o:["SHA-256","bcrypt","AES","RSA"],c:1,e:"bcrypt, scrypt, Argon2."},

/* ============ 3) REDES (20) ============ */
{t:"Redes",p:"¿Qué hace un firewall?",o:["Antivirus","Filtra tráfico por reglas","Cifra discos","Detecta malware"],c:1,e:"Controla el tráfico."},
{t:"Redes",p:"¿Stateful vs stateless?",o:["Iguales","Stateful recuerda conexiones","Stateless más seguro","Stateful más rápido"],c:1,e:"Tabla de conexiones."},
{t:"Redes",p:"¿Qué es un IDS?",o:["Detección de intrusiones","Cifrado","Firewall","Antivirus"],c:0,e:"Detecta pero no bloquea."},
{t:"Redes",p:"¿IDS vs IPS?",o:["Iguales","IPS bloquea; IDS solo alerta","IDS más rápido","IPS solo alerta"],c:1,e:"Prevention vs Detection."},
{t:"Redes",p:"¿Qué es una VPN?",o:["Antivirus","Red privada virtual cifrada","Firewall","IDS"],c:1,e:"Túnel cifrado."},
{t:"Redes",p:"¿Protocolo VPN moderno?",o:["HTTP","WireGuard","FTP","SNMP"],c:1,e:"WireGuard, OpenVPN, IPsec."},
{t:"Redes",p:"¿Qué es el modelo OSI?",o:["Algoritmo","Modelo de 7 capas","Firewall","Protocolo"],c:1,e:"Referencia de redes."},
{t:"Redes",p:"¿Capa OSI de un firewall tradicional?",o:["Capa 1","Capas 3 y 4","Capa 7","Capa 2"],c:1,e:"Red y transporte."},
{t:"Redes",p:"¿Qué es un WAF?",o:["Web Application Firewall","Wireless Access Firewall","Wide Area Firewall","Wireless Auth Framework"],c:0,e:"Capa 7."},
{t:"Redes",p:"¿Qué es DDoS?",o:["Fuerza bruta","Denegación distribuida","Virus","Phishing"],c:1,e:"Múltiples fuentes."},
{t:"Redes",p:"¿Qué es MITM?",o:["Ataque físico","Interceptar comunicación","Virus","Firewall"],c:1,e:"Man-in-the-Middle."},
{t:"Redes",p:"¿Qué es ARP spoofing?",o:["Falsificar respuestas ARP","Cifrar ARP","Bloquear ARP","Firmar ARP"],c:0,e:"Permite MITM local."},
{t:"Redes",p:"¿Qué es sniffing?",o:["Capturar tráfico","Cifrar","Bloquear","Firmar"],c:0,e:"Wireshark, tcpdump."},
{t:"Redes",p:"¿Protocolo inseguro de admin remota?",o:["SSH","Telnet","HTTPS","SFTP"],c:1,e:"Transmite en claro."},
{t:"Redes",p:"¿Qué reemplaza a HTTP cifrado?",o:["FTP","HTTPS","SMTP","SNMP"],c:1,e:"HTTP sobre TLS."},
{t:"Redes",p:"¿Qué es IP spoofing?",o:["Falsificar IP origen","Cifrar IP","Bloquear IP","Renovar IP"],c:0,e:"Reflexión/amplificación."},
{t:"Redes",p:"¿Qué es DNS spoofing?",o:["Falsificar respuestas DNS","Cifrar DNS","Bloquear DNS","Renovar DNS"],c:0,e:"Redirige a sitios maliciosos."},
{t:"Redes",p:"¿Qué es una DMZ?",o:["Zona entre red interna y externa","Firewall","VPN","IDS"],c:0,e:"Expone servicios públicos."},
{t:"Redes",p:"¿Qué es 802.1X?",o:["Autenticación de acceso a red","Cifrado WiFi","Firewall","Antivirus"],c:0,e:"Controla acceso a puertos."},
{t:"Redes",p:"¿Qué es Zero Trust?",o:["Confiar dentro","No confiar, verificar siempre","Cifrar","Bloquear todo"],c:1,e:"Never trust, always verify."},

function mezclar(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function preparar(q){
  const ops = q.o.map((texto,i) => ({texto, correcta: i===q.c}));
  const mez = mezclar(ops);
  return {
    tema:q.t, p:q.p,
    o: mez.map(x => x.texto),
    c: mez.findIndex(x => x.correcta),
    e: q.e
  };
}

const estado = {
  tema:'TODOS', preguntas:[], idx:0, correctas:0, respuestas:[]
};

        `).join('')}

  });

/* =========================================================
   INICIAR
   ========================================================= */
function iniciar(tema){
  estado.tema = tema;
  let base = tema === 'TODOS' ? BANCO : BANCO.filter(q => q.t === tema);
  base = mezclar(base);
  if (tema === 'TODOS' && base.length > TOTAL_EXAMEN) base = base.slice(0, TOTAL_EXAMEN);

  estado.preguntas = base.map(preparar);
  estado.idx = 0;
  estado.correctas = 0;
  estado.respuestas = [];
  pintarPregunta();
}

/* =========================================================
   PREGUNTA
   ========================================================= */
function pintarPregunta(){
  const q = estado.preguntas[estado.idx];
  const total = estado.preguntas.length;
  const num = estado.idx + 1;
  const progreso = (estado.idx / total) * 100;
  const resp = estado.respuestas[estado.idx];
  const esUltima = num === total;

  const opcionesHTML = q.o.map((op,i) => {
    let clase = '';
    if (resp){
      if (i === q.c) clase = 'correcta';
      else if (i === resp.elegida) clase = 'incorrecta';
      else clase = 'apagada';
    }
    return `<button class="opcion ${clase}" data-i="${i}" ${resp ? 'disabled' : ''}>
      <span class="letra">${LETRAS[i]}</span><span>${op}</span></button>`;
  }).join('');

  let feedbackHTML = '';
  if (resp){
    const ok = resp.elegida === q.c;
    feedbackHTML = `
      <div class="feedback ${ok ? 'ok' : 'mal'}">
        <b>${ok ? '✅ ¡Correcto! (+1 punto)' : '❌ Incorrecto'}</b>
        ${ok ? '' : `La respuesta correcta es: <b>${q.o[q.c]}</b><br>`}
        ${q.e ? `<span style="color:var(--muted)">${q.e}</span>` : ''}
      </div>`;
  }

  $app.innerHTML = `
    <div class="card">
      <div class="barra-sup">
        <span class="badge b-${q.tema}">${NOMBRES_TEMA[q.tema] || q.tema}</span>
        <span class="contador">Pregunta ${num} de ${total}</span>
        <span class="puntos">✅ ${estado.correctas} pts</span>
      </div>
      <div class="progreso"><div style="width:${progreso}%"></div></div>
      <h2 class="pregunta">${q.p}</h2>
      <div class="opciones">${opcionesHTML}</div>
      ${feedbackHTML}
      ${resp ? `<button class="btn principal" id="btnSiguiente">${esUltima ? '🏁 Ver resultado final' : 'Siguiente →'}</button>` : ''}
    </div>
  `;

  if (!resp){
    document.querySelectorAll('.opcion').forEach(btn => {
      btn.addEventListener('click', () => responder(Number(btn.dataset.i)));
    });
  } else {
    document.getElementById('btnSiguiente').addEventListener('click', siguiente);
  }
}

function responder(i){
  if (estado.respuestas[estado.idx]) return;
  const q = estado.preguntas[estado.idx];
  const ok = i === q.c;
  estado.respuestas[estado.idx] = { elegida:i, ok };
  if (ok) estado.correctas++;
  pintarPregunta();
}
function siguiente(){
  if (estado.idx < estado.preguntas.length - 1){
    estado.idx++; pintarPregunta();
  } else {
    pantallaResultado();
  }
}

/* =========================================================
   RESULTADO
   ========================================================= */
let soloIncorrectas = false;
let aprobadoFlag = false;

function pantallaResultado(){
  const total = estado.preguntas.length;
  const correctas = estado.correctas;
  const requeridas = Math.ceil(total * PORC_APROBACION);
  const aprobado = correctas >= requeridas;
  const pct = Math.round((correctas/total)*100);
  const pctMeta = Math.round((requeridas/total)*100);
  aprobadoFlag = aprobado;

  const desglose = {};
  estado.preguntas.forEach((q,i) => {
    desglose[q.tema] = desglose[q.tema] || { ok:0, total:0 };
    desglose[q.tema].total++;
    if (estado.respuestas[i] && estado.respuestas[i].ok) desglose[q.tema].ok++;
  });

  const desgloseHTML = Object.entries(desglose).map(([tema,d]) => {
    const p = Math.round((d.ok/d.total)*100);
    return `<div class="fila-tema">
      <span class="nombre" style="color:${COLOR_TEMA[tema]||'#22d3ee'}">${tema}</span>
      <span class="barra"><div style="width:${p}%;background:${COLOR_TEMA[tema]||'#22d3ee'}"></div></span>
      <span class="valores">${d.ok}/${d.total}</span>
    </div>`;
  }).join('');

  $app.innerHTML = `
    <div class="card">
      <div class="resultado-hero">
        <div class="estado-final ${aprobado ? 'aprobado' : 'reprobado'}">
          ${aprobado ? '🏆 APROBADO' : '📚 REPROBADO'}
        </div>
        <div class="puntaje-grande">${correctas}<small> / ${total} puntos</small></div>
        <p class="nota">
          ${aprobado
            ? `¡Superaste la meta de ${requeridas} puntos (${pctMeta}%). Ahora puedes obtener tu certificado.`
            : `Necesitabas ${requeridas} puntos. Te faltaron ${requeridas - correctas}.`}
        </p>
      </div>
      <div class="barra-resultado">
        <div style="width:${pct}%;background:${aprobado ? 'linear-gradient(90deg,#22c55e,#4ade80)' : 'linear-gradient(90deg,#ef4444,#f87171)'}"></div>
        <div class="meta-linea" style="left:${pctMeta}%"></div>
      </div>
      <p class="nota" style="text-align:center">Aciertos: <b>${pct}%</b> · Meta: <b>${pctMeta}%</b> (línea amarilla)</p>

      ${aprobado ? `
        <button class="btn gold" id="btnCert">🎓 Generar mi certificado</button>
      ` : ''}

      <div class="desglose" style="margin-top:20px">
        <h2 class="titulo">Desglose por subtema</h2>
        ${desgloseHTML}
      </div>
      <div class="acciones">
        <button class="btn principal" id="btnRepetir" style="margin-top:0">🔄 Intentar de nuevo</button>
        <button class="btn sec" id="btnInicio">🏠 Volver al inicio</button>
      </div>
    </div>

    <div class="card">
      <h2 class="titulo">Revisión de respuestas</h2>
      <label class="toggle">
        <input type="checkbox" id="chkIncorrectas" ${soloIncorrectas ? 'checked' : ''}>
        Mostrar solo las incorrectas
      </label>
      <div class="revision" id="listaRevision"></div>
    </div>
  `;

  pintarRevision();
  document.getElementById('btnRepetir').addEventListener('click', () => iniciar(estado.tema));
  document.getElementById('btnInicio').addEventListener('click', pantallaInicio);
  document.getElementById('chkIncorrectas').addEventListener('change', e => {
    soloIncorrectas = e.target.checked; pintarRevision();
  });

  if (aprobado){
    document.getElementById('btnCert').addEventListener('click', pedirDatosCertificado);
  }
}

function pintarRevision(){
  const cont = document.getElementById('listaRevision');
  if (!cont) return;
  const items = estado.preguntas.map((q,i) => ({q, r: estado.respuestas[i]}))
    .filter(x => !soloIncorrectas || !x.r || !x.r.ok);
  if (!items.length){
    cont.innerHTML = `<p class="sub">🎉 ¡No hay incorrectas!</p>`;
    return;
  }
  cont.innerHTML = items.map(({q,r}) => {
    const ok = r && r.ok;
    const elegida = r ? q.o[r.elegida] : '(sin responder)';
    return `<div class="rev-item ${ok ? 'bien' : ''}">
      <div class="p"><span class="badge b-${q.tema}" style="margin-right:6px">${q.tema}</span>${q.p}</div>
      <div class="r ${ok ? 'ok' : ''}">${ok ? '✅' : '❌'} Tu respuesta: ${elegida}</div>
      ${ok ? '' : `<div class="r ok">✔ Correcta: ${q.o[q.c]}</div>`}
      ${q.e ? `<div class="ex">💡 ${q.e}</div>` : ''}
    </div>`;
  }).join('');
}

/* =========================================================
   FORMULARIO DE CERTIFICADO
   ========================================================= */
function pedirDatosCertificado(){
  const total = estado.preguntas.length;
  const correctas = estado.correctas;
  const pct = Math.round((correctas/total)*100);
  const temaTxt = estado.tema === 'TODOS'
    ? 'Ciberseguridad (Examen General)'
    : NOMBRES_TEMA[estado.tema] || estado.tema;

  $app.innerHTML = `
    <div class="card">
      <h2 class="titulo">🎓 Certificado de Aprobación</h2>
      <p class="sub">
        Has aprobado con <b>${correctas}/${total} (${pct}%)</b>.
        Ingresa tus datos para generar el certificado.
        Se enviará una notificación al administrador con tu información.
      </p>

      <form class="form-aprob" id="formCert">
        <div>
          <label>Nombre completo *</label>
          <input type="text" id="cNombre" required maxlength="60" placeholder="Ej: Juan Pérez">
        </div>
        <div>
          <label>Correo electrónico *</label>
          <input type="email" id="cEmail" required maxlength="80" placeholder="ejemplo@correo.com">
        </div>
        <div>
          <label>Número de identificación *</label>
          <input type="text" id="cId" required maxlength="30" placeholder="Ej: 1234567890">
        </div>
        <button type="submit" class="btn gold" id="btnEnviar" style="margin-top:4px">
          📨 Enviar y generar certificado
        </button>
      </form>

      <div class="status" id="statusBox"></div>

      <div class="acciones" style="margin-top:16px">
        <button class="btn sec" id="btnVolverRes">← Volver al resultado</button>
      </div>
    </div>
  `;

  document.getElementById('btnVolverRes').addEventListener('click', pantallaResultado);

  document.getElementById('formCert').addEventListener('submit', async e => {
    e.preventDefault();
    const nombre = document.getElementById('cNombre').value.trim();
    const email  = document.getElementById('cEmail').value.trim();
    const ident  = document.getElementById('cId').value.trim();

    if (!nombre || !email || !ident){
      mostrarStatus('err','Por favor completa todos los campos.');
      return;
    }

    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Enviando notificación...';

    const datos = {
      nombre, email,
      identificacion: ident,
      puntaje: `${correctas}/${total}`,
      porcentaje: `${pct}%`,
      curso: temaTxt,
      fecha: new Date().toLocaleString('es-ES')
    };

    try {
      await notificarAdmin(datos);
      mostrarStatus('ok', '✅ Notificación enviada al administrador. Generando certificado...');
      setTimeout(() => abrirCertificado(datos), 800);
    } catch (err){
      mostrarStatus('err', '⚠️ No se pudo notificar al administrador, pero puedes generar tu certificado igualmente.');
      setTimeout(() => abrirCertificado(datos), 1500);
    }
  });
}

function mostrarStatus(tipo, msg){
  const el = document.getElementById('statusBox');
  if (!el) return;
  el.className = 'status show ' + tipo;
  el.textContent = msg;
}

/* =========================================================
   NOTIFICAR AL ADMIN — FormSubmit.co
   ---------------------------------------------------------
   La PRIMERA VEZ que se envíe, FormSubmit enviará un correo
   de confirmación a info.rsasystems@gmail.com. Hay que hacer
   clic en el enlace de confirmación UNA sola vez.
   ========================================================= */
async function notificarAdmin(datos){
  const resp = await fetch(`https://formsubmit.co/ajax/${ADMIN_EMAIL}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      _subject: `🎓 Certificado aprobado — ${datos.nombre}`,
      _template: 'table',
      _captcha: 'false',
      Nombre: datos.nombre,
      Email: datos.email,
      Identificación: datos.identificacion,
      Curso: datos.curso,
      Puntaje: datos.puntaje,
      Porcentaje: datos.porcentaje,
      Fecha: datos.fecha
    })
  });
  if (!resp.ok) throw new Error('Error al notificar');
  return resp.json();
}

/* =========================================================
   ABRIR CERTIFICADO (App 2)
   ========================================================= */
function abrirCertificado(datos){
  const params = new URLSearchParams({
    nombre: datos.nombre,
    email: datos.email,
    id: datos.identificacion,
    score: String(estado.correctas),
    total: String(estado.preguntas.length),
    pct: String(Math.round((estado.correctas/estado.preguntas.length)*100)),
    curso: datos.curso
  });
  const url = `${CERT_URL}?${params.toString()}`;

  const total = estado.preguntas.length;
  const correctas = estado.correctas;
  const pct = Math.round((correctas/total)*100);
  const temaTxt = estado.tema === 'TODOS'
    ? 'Ciberseguridad (Examen General)'
    : NOMBRES_TEMA[estado.tema] || estado.tema;

  $app.innerHTML = `
    <div class="card">
      <div class="resultado-hero">
        <div class="estado-final aprobado">✅ LISTO</div>
        <p class="nota">Tu certificado está disponible. Se abrirá en una nueva pestaña.</p>
      </div>

      <div style="background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px">
        <h2 class="titulo" style="margin-bottom:10px">📋 Resumen</h2>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.85rem">
          <span style="color:var(--muted)">Nombre:</span><b>${datos.nombre}</b>
          <span style="color:var(--muted)">Email:</span><b>${datos.email}</b>
          <span style="color:var(--muted)">Identificación:</span><b>${datos.identificacion}</b>
          <span style="color:var(--muted)">Curso:</span><b>${temaTxt}</b>
          <span style="color:var(--muted)">Puntaje:</span><b>${correctas}/${total} (${pct}%)</b>
        </div>
      </div>

      <button class="btn gold" id="btnAbrirCert">🎓 Abrir mi certificado</button>

      <div class="link-box" style="margin-top:14px">
        <div style="color:var(--muted);font-size:.72rem;margin-bottom:4px">Link directo:</div>
        <a href="${url}" target="_blank" style="color:#67e8f9;text-decoration:underline">${url}</a>
      </div>

      <div class="acciones" style="margin-top:16px">
        <button class="btn sec" id="btnInicio2">🏠 Volver al inicio</button>
      </div>
    </div>
  `;

  document.getElementById('btnAbrirCert').addEventListener('click', () => {
    window.open(url, '_blank');
  });
  document.getElementById('btnInicio2').addEventListener('click', pantallaInicio);
}

/* =========================================================
   ATAJOS
   ========================================================= */
document.addEventListener('keydown', e => {
  const opciones = document.querySelectorAll('.opcion:not([disabled])');
  if (opciones.length && /^[1-4]$/.test(e.key)){
    const i = Number(e.key) - 1;
    if (opciones[i]) opciones[i].click();
    return;
  }
  if (e.key === 'Enter'){
    const sig = document.getElementById('btnSiguiente');
    if (sig) sig.click();
  }
});

pantallaInicio();
</script>
</body>
</html>
