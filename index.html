<html lang="es">
<head>

<title>CyberQuiz · 320 preguntas de Ciberseguridad</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050b14;--panel:#0d1524;--panel2:#152238;--txt:#e6f0ff;
  --muted:#8aa0c0;--line:#1f2f47;--accent:#22d3ee;--ok:#22c55e;
  --bad:#ef4444;--warn:#f59e0b;--gold:#d4af37;--gold-2:#a17b28;
}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#0a2540 0%,var(--bg) 55%);
  color:var(--txt);min-height:100vh;display:flex;justify-content:center;
  padding:24px 16px 60px;
}
.app{width:100%;max-width:940px}
.marca{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:52px;height:52px;border-radius:15px;
  background:linear-gradient(135deg,#22d3ee,#6366f1);
  display:grid;place-items:center;font-size:26px;
  box-shadow:0 8px 28px rgba(34,211,238,.35)}
.marca h1{font-size:1.15rem}.marca p{font-size:.76rem;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:22px;margin-bottom:16px}
h2.titulo{font-size:1.02rem;margin-bottom:6px}
p.sub{color:var(--muted);font-size:.85rem;line-height:1.5}
.grid-temas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:10px;margin-top:16px}
.tema-btn{background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:14px;text-align:left;cursor:pointer;
  color:var(--txt);transition:.18s;font-family:inherit;font-size:.85rem}
.tema-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.tema-btn .nom{font-weight:700;font-size:.9rem;display:block;margin-bottom:3px}
.tema-btn .cant{font-size:.7rem;color:var(--muted)}
.btn{font-family:inherit;font-size:.92rem;font-weight:600;
  border:none;border-radius:11px;padding:13px 20px;cursor:pointer;transition:.18s}
.btn.principal{background:linear-gradient(135deg,#22d3ee,#6366f1);
  color:#02131c;width:100%;margin-top:14px;box-shadow:0 8px 22px rgba(34,211,238,.25)}
.btn.principal:hover{filter:brightness(1.1)}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(135deg,#d4af37,#a17b28);color:#2a1c00;
  box-shadow:0 8px 22px rgba(212,175,55,.28);width:100%;margin-top:14px;font-weight:700}
.btn.gold:hover{filter:brightness(1.08)}
.barra-sup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:12px;font-size:.8rem}
.badge{padding:4px 11px;border-radius:999px;font-weight:700;font-size:.68rem;
  letter-spacing:.4px;background:#16233a;border:1px solid var(--line)}
.contador{color:var(--muted)}.puntos{margin-left:auto;font-weight:700;color:var(--ok)}
.progreso{height:7px;background:#0a1220;border-radius:999px;overflow:hidden;
  margin-bottom:20px;border:1px solid var(--line)}
.progreso > div{height:100%;background:linear-gradient(90deg,#22d3ee,#6366f1);
  transition:width .3s}
.pregunta{font-size:1.08rem;line-height:1.5;margin-bottom:18px;font-weight:600}
.opciones{display:flex;flex-direction:column;gap:9px}
.opcion{display:flex;align-items:center;gap:12px;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;
  color:var(--txt);font-family:inherit;font-size:.9rem;
  text-align:left;cursor:pointer;transition:.15s}
.opcion:hover:not(:disabled){border-color:var(--accent);background:#1c2e4a}
.letra{width:26px;height:26px;flex:0 0 26px;border-radius:7px;
  background:#0a1220;display:grid;place-items:center;
  font-weight:700;font-size:.74rem;color:var(--muted)}
.opcion.correcta{background:rgba(34,197,94,.14);border-color:var(--ok)}
.opcion.correcta .letra{background:var(--ok);color:#04210f}
.opcion.incorrecta{background:rgba(239,68,68,.14);border-color:var(--bad)}
.opcion.incorrecta .letra{background:var(--bad);color:#2b0606}
.opcion.apagada{opacity:.5}
.feedback{margin-top:14px;padding:13px 15px;border-radius:11px;
  font-size:.83rem;line-height:1.5;border:1px solid}
.feedback.ok{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.45)}
.feedback.mal{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.45)}
.feedback b{display:block;margin-bottom:3px}
.resultado-hero{text-align:center;padding:12px 0 4px}
.estado-final{font-size:2rem;font-weight:800;letter-spacing:1px;margin-bottom:4px}
.aprobado{color:var(--ok)}.reprobado{color:var(--bad)}
.puntaje-grande{font-size:3.2rem;font-weight:800;line-height:1}
.puntaje-grande small{font-size:1rem;color:var(--muted);font-weight:600}
.nota{color:var(--muted);font-size:.84rem;margin-top:6px}
.barra-resultado{height:13px;background:#0a1220;border-radius:999px;
  overflow:hidden;margin:16px 0 6px;border:1px solid var(--line);position:relative}
.barra-resultado > div{height:100%;transition:width .6s}
.meta-linea{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn)}
.desglose{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.fila-tema{display:flex;align-items:center;gap:10px;font-size:.78rem}
.fila-tema .nombre{width:118px;font-weight:700}
.fila-tema .barra{flex:1;height:7px;background:#0a1220;border-radius:999px;overflow:hidden}
.fila-tema .barra > div{height:100%}
.fila-tema .valores{width:52px;text-align:right;color:var(--muted)}
.revision{max-height:400px;overflow-y:auto;padding-right:6px;margin-top:6px}
.rev-item{border-left:3px solid var(--bad);background:var(--panel2);
  border-radius:0 11px 11px 0;padding:11px 13px;margin-bottom:9px;
  font-size:.81rem;line-height:1.5}
.rev-item.bien{border-left-color:var(--ok)}
.rev-item .p{font-weight:600;margin-bottom:5px}
.rev-item .r{color:#fca5a5}.rev-item .r.ok{color:#86efac}
.rev-item .ex{color:var(--muted);font-size:.76rem;margin-top:4px}
.acciones{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.acciones .btn{flex:1;min-width:140px}
.toggle{display:flex;align-items:center;gap:8px;font-size:.8rem;
  color:var(--muted);margin-top:12px;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.form-aprob{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.form-aprob label{font-size:.76rem;color:var(--muted);font-weight:600;
  display:block;margin-bottom:5px}
.form-aprob input{width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--txt);
  font-family:inherit;font-size:.92rem;transition:.15s}
.form-aprob input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.status{padding:12px 14px;border-radius:10px;font-size:.85rem;margin-top:12px;
  border:1px solid;display:none}
.status.show{display:block}
.status.ok{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.5);color:#86efac}
.status.err{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.5);color:#fca5a5}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#0a1220}
::-webkit-scrollbar-thumb{background:#263a56;border-radius:8px}

/* ============================================================
   CERTIFICADO A4 HORIZONTAL
   ============================================================ */
.cert-viewport{
  width:100%;
  text-align:center;
  padding:16px 0;
  overflow:visible;
  background:#0a1220;
  border-radius:14px;
  border:1px solid var(--line);
  margin-top:16px;
}
.cert-shadow{
  display:inline-block;
  box-shadow:0 20px 60px rgba(0,0,0,.55),0 8px 20px rgba(0,0,0,.35);
  line-height:0;
}
.cert{
  display:inline-block;
  vertical-align:top;
  text-align:left;
  width:1123px;
  height:794px;
  background:#fffdf7;
  color:#0a1628;
  position:relative;
  overflow:hidden;
  font-family:'Inter',sans-serif;
}
.cert-frame{position:absolute;inset:23px;border:2px solid #a17b28;pointer-events:none}
.cert-frame::before{content:'';position:absolute;inset:6px;
  border:1px solid #a17b28;opacity:.5;pointer-events:none}
.corner{position:absolute;width:50px;height:50px;border:2px solid #a17b28;pointer-events:none}
.corner.tl{top:23px;left:23px;border-right:0;border-bottom:0}
.corner.tr{top:23px;right:23px;border-left:0;border-bottom:0}
.corner.bl{bottom:23px;left:23px;border-right:0;border-top:0}
.corner.br{bottom:23px;right:23px;border-left:0;border-top:0}

.cert-inner{position:absolute;inset:38px 53px;display:flex;
  flex-direction:column;padding:8px 15px}

.cert-header{display:flex;justify-content:space-between;align-items:flex-start;
  gap:30px;padding-bottom:18px}
.logo-area{display:flex;align-items:center;gap:15px;max-width:58%;min-width:0}

/* Logo RSA */
.rsa-logo{
  width:64px;height:64px;flex-shrink:0;
  background:#0099e0;
  border:2px solid #fff;
  box-shadow:0 0 0 1px #0099e0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;overflow:hidden;position:relative;border-radius:2px;
}
.rsa-main{color:#fff;font-family:'Inter',sans-serif;font-weight:300;
  font-size:24px;line-height:1;letter-spacing:1.5px}
.rsa-sub{color:#fff;font-family:'Inter',sans-serif;font-weight:400;
  font-size:6px;line-height:1;letter-spacing:.5px}

.academy-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.academy-name{font-family:'Playfair Display',serif;font-weight:700;font-size:17px;
  color:#0a1628;letter-spacing:.3px;line-height:1.2;word-break:break-word}
.academy-tag{font-size:8px;letter-spacing:2.5px;text-transform:uppercase;
  color:#a17b28;font-weight:600;word-break:break-word;line-height:1.4}

/* ============================================================
   ✅ ÁREA DEL ID — CORREGIDA: separada y más grande
   ============================================================ */
.cert-id-area{
  text-align:right;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;                    /* Separación clara entre label y valor */
  padding-top:2px;
}
.cert-id-label{
  font-size:10px;              /* +2px (antes 8px) */
  letter-spacing:3px;
  color:#8b9bb8;
  text-transform:uppercase;
  font-weight:500;
  line-height:1;
  white-space:nowrap;
}
.cert-id-value{
  font-family:'Playfair Display',serif;
  font-weight:600;
  font-size:13px;              /* +2px (antes 11px) */
  color:#a17b28;
  letter-spacing:.5px;
  line-height:1;
  white-space:nowrap;
}

.cert-divider{height:1px;background:#a17b28;opacity:.5;margin-bottom:15px}
.cert-main{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:8px 0}
.cert-title{font-family:'Playfair Display',serif;font-weight:800;font-size:49px;
  line-height:1;color:#0a1628;letter-spacing:1.5px;margin-bottom:6px}
.cert-title-sub{font-family:'Playfair Display',serif;font-style:italic;
  font-weight:400;font-size:15px;color:#a17b28;letter-spacing:4px;
  text-transform:uppercase;margin-bottom:20px;line-height:1}
.ornament{display:flex;align-items:center;justify-content:center;
  gap:10px;color:#a17b28;margin-bottom:20px}
.ornament .line{width:83px;height:1px;background:#a17b28;opacity:.5}
.ornament .diamond{width:9px;height:9px;transform:rotate(45deg);background:#a17b28}
.ornament .dot{width:4px;height:4px;border-radius:50%;background:#a17b28;opacity:.7}

.cert-presents{font-size:11px;color:#4a5568;font-style:italic;
  margin-bottom:13px;letter-spacing:.3px;line-height:1.4}
.cert-name{font-family:'Great Vibes',cursive;font-size:82px;line-height:1.05;
  color:#a17b28;padding:0 23px;max-width:100%;word-break:break-word}
.cert-name-line{width:242px;height:1px;background:#a17b28;
  opacity:.5;margin:4px auto 15px}
.cert-completed{font-size:11px;color:#4a5568;margin-bottom:10px;
  letter-spacing:.3px;line-height:1.4}
.cert-course{font-family:'Playfair Display',serif;font-weight:700;font-size:26px;
  color:#0a1628;letter-spacing:1px;text-transform:uppercase;
  line-height:1.15;padding:0 23px;max-width:100%;word-break:break-word;
  margin-bottom:15px}
.cert-score{display:inline-flex;align-items:baseline;gap:8px;padding:9px 26px;
  border:1px solid #a17b28;border-radius:45px;background:#fdf6e3}
.cert-score .val{font-family:'Playfair Display',serif;font-weight:800;font-size:23px;
  color:#a17b28;line-height:1}
.cert-score .sep{font-size:15px;color:#8b9bb8;font-weight:300}
.cert-score .tot{font-family:'Playfair Display',serif;font-weight:600;font-size:17px;
  color:#4a5568;line-height:1}
.cert-score .pct{font-size:10px;color:#a17b28;font-weight:700;
  letter-spacing:1px;margin-left:4px;padding-left:11px;border-left:1px solid #a17b28}

/* ============================================================
   ✅ FOOTER — CORREGIDO: sin sobreposición + firma del director
   ============================================================ */
.cert-footer{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:24px;
  padding-top:12px;
  border-top:1px solid #c8d1e0;
}
.cert-footer .sign-block{
  flex:0 0 240px;              /* Ancho fijo para evitar solapamiento */
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:3px;
}
.cert-footer .seal{
  flex:0 0 auto;
  align-self:flex-end;
  margin-bottom:6px;
}

/* Área de la firma manuscrita */
.sign-signature{
  height:48px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  margin-bottom:0;
  line-height:1;
}
.sign-signature img,
.sign-signature svg{
  max-height:48px;
  max-width:220px;
  object-fit:contain;
  display:block;
}
/* Firma manuscrita por defecto (usando Great Vibes) */
.sign-signature .sig-text{
  font-family:'Great Vibes',cursive;
  font-size:34px;
  color:#0a1628;
  line-height:1;
  transform:rotate(-2deg);
  padding:0 6px;
  white-space:nowrap;
}

.sign-line{
  width:200px;
  height:1px;
  background:#0a1628;
  opacity:.45;
  margin-bottom:5px;
  flex-shrink:0;
}
.sign-name{
  font-family:'Playfair Display',serif;
  font-weight:600;
  font-size:12px;
  color:#0a1628;
  letter-spacing:.3px;
  line-height:1.3;
  word-break:break-word;
  max-width:100%;
}
.sign-role{
  font-size:9px;
  color:#8b9bb8;
  letter-spacing:.8px;
  text-transform:uppercase;
  line-height:1.3;
  word-break:break-word;
  max-width:100%;
}

.seal{
  width:83px;height:83px;border-radius:50%;
  background:#fff;border:3px solid #a17b28;
  display:flex;align-items:center;justify-content:center;
  box-sizing:border-box;padding:5px;
}
.seal-inner{width:100%;height:100%;border-radius:50%;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;border:1px solid #d4af37;box-sizing:border-box}
.seal-check{font-size:17px;color:#a17b28;line-height:1;font-weight:700}
.seal-txt{font-size:6px;letter-spacing:1.5px;color:#a17b28;
  font-weight:700;text-transform:uppercase;line-height:1}
.seal-year{font-size:7px;color:#8b9bb8;font-weight:600;letter-spacing:.5px;line-height:1}

#pdf-overlay{
  position:fixed;inset:0;z-index:999999;
  background:rgba(5,11,20,.97);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;color:#fff;
  font-family:system-ui,sans-serif;font-size:1.05rem;
}
#pdf-overlay.show{display:flex}
.notif{position:fixed;bottom:20px;right:20px;background:var(--panel);
  border:1px solid var(--accent);border-radius:12px;padding:12px 18px;
  font-size:.82rem;box-shadow:0 10px 30px rgba(0,0,0,.5);
  transform:translateY(120%);transition:.35s;z-index:9999;max-width:340px}
.notif.show{transform:translateY(0)}
.notif.ok{border-color:#22c55e}
.notif.err{border-color:#ef4444}
</style>
</head>

<div class="app">
  <div class="marca">
    <div class="logo">🛡️</div>
    <div>
      <h1>CyberQuiz · 320 preguntas</h1>
      <p>16 subtemas · 20 preguntas cada uno · aprueba con 70% y obtén tu certificado</p>
    </div>
  </div>
  <main id="app"></main>
</div>

<div id="pdf-overlay">
  <div style="font-size:48px">⏳</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const TOTAL_EXAMEN    = 100;
const PORC_APROBACION = 0.70;
const ADMIN_EMAIL     = 'info.rsasystems@gmail.com';

/* =========================================================
   ✅ DETECCIÓN DE IDIOMA
   ========================================================= */
const NAV_LANG = (navigator.language || navigator.userLanguage || 'es').toLowerCase();
const IS_ES = NAV_LANG.startsWith('es');
const T = IS_ES ? {
  certLabel:   'Certificado',
  title:       'Certificado',
  subtitle:    'de Logro',
  presents:    'Se certifica que',
  hasCompleted:'ha completado satisfactoriamente el curso',
  verified:    'Verificado',
  director:    'Director Académico',
  issueDate:   'Fecha de expedición',
  academyName: 'RSA Academy',
  academyTag:  'Formación en Ciberseguridad'
} : {
  certLabel:   'Certificate',
  title:       'Certificate',
  subtitle:    'of Achievement',
  presents:    'This is to certify that',
  hasCompleted:'has successfully completed the course',
  verified:    'Verified',
  director:    'Academic Director',
  issueDate:   'Issue Date',
  academyName: 'RSA Academy',
  academyTag:  'Cybersecurity Training'
};

/* =========================================================
   BANCO — 320 preguntas · 16 subtemas × 20
   ========================================================= */
const BANCO = [
/* ============ 1) FUNDAMENTOS (20) ============ */
{t:"Fundamentos",p:"¿Qué representa la 'C' de la tríada CIA?",o:["Control","Confidencialidad","Certificado","Contingencia"],c:1,e:"CIA = Confidencialidad, Integridad, Disponibilidad."},
{t:"Fundamentos",p:"¿Qué garantiza la Integridad en la tríada CIA?",o:["Que los datos no sean alterados sin autorización","Que estén siempre disponibles","Que sean públicos","Que estén cifrados"],c:0,e:"Evita modificaciones no autorizadas."},
{t:"Fundamentos",p:"¿Qué garantiza la Disponibilidad?",o:["Cifrado","Acceso cuando se necesita","Autenticación","Borrado de logs"],c:1,e:"Los sistemas deben estar accesibles."},
{t:"Fundamentos",p:"¿Qué significa AAA en seguridad?",o:["Audit, Alert, Action","Authentication, Authorization, Accounting","Access, Allow, Accept","Analyze, Assess, Apply"],c:1,e:"Autenticación, Autorización, Auditoría."},
{t:"Fundamentos",p:"¿Qué es el 'no repudio'?",o:["No poder negar haber realizado una acción","No cifrar datos","No usar contraseñas","No acceder al sistema"],c:0,e:"Garantiza la autoría de una acción."},
{t:"Fundamentos",p:"¿Qué es una vulnerabilidad?",o:["Un ataque","Una debilidad explotable","Un antivirus","Un firewall"],c:1,e:"Debilidad que puede ser explotada."},

function mezclar(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function preparar(q){
  const ops = q.o.map((texto,i) => ({texto, correcta: i===q.c}));
  const mez = mezclar(ops);
  return {
    tema:q.t, p:q.p,
    o: mez.map(x => x.texto),
    c: mez.findIndex(x => x.correcta),
    e: q.e
  };
}
function notif(msg, tipo='ok'){
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.className = 'notif show ' + tipo;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'notif ' + tipo, 3200);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

/* =========================================================
   INICIAR
   ========================================================= */
function iniciar(tema){
  estado.tema = tema;
  let base = tema === 'TODOS' ? BANCO : BANCO.filter(q => q.t === tema);
  base = mezclar(base);
  if (tema === 'TODOS' && base.length > TOTAL_EXAMEN) base = base.slice(0, TOTAL_EXAMEN);

  estado.preguntas = base.map(preparar);
  estado.idx = 0;
  estado.correctas = 0;
  estado.respuestas = [];
  pintarPregunta();
}

/* =========================================================
   PREGUNTA
   ========================================================= */
function pintarPregunta(){
  const q = estado.preguntas[estado.idx];
  const total = estado.preguntas.length;
  const num = estado.idx + 1;
  const progreso = (estado.idx / total) * 100;
  const resp = estado.respuestas[estado.idx];
  const esUltima = num === total;

  const opcionesHTML = q.o.map((op,i) => {
    let clase = '';
    if (resp){
      if (i === q.c) clase = 'correcta';
      else if (i === resp.elegida) clase = 'incorrecta';
      else clase = 'apagada';
    }
    return `<button class="opcion ${clase}" data-i="${i}" ${resp ? 'disabled' : ''}>
      <span class="letra">${LETRAS[i]}</span><span>${op}</span></button>`;
  }).join('');

  let feedbackHTML = '';
  if (resp){
    const ok = resp.elegida === q.c;
    feedbackHTML = `
      <div class="feedback ${ok ? 'ok' : 'mal'}">
        <b>${ok ? '✅ ¡Correcto! (+1 punto)' : '❌ Incorrecto'}</b>
        ${ok ? '' : `La respuesta correcta es: <b>${q.o[q.c]}</b><br>`}
        ${q.e ? `<span style="color:var(--muted)">${q.e}</span>` : ''}
      </div>`;
  }

  $app.innerHTML = `
    <div class="card">
      <div class="barra-sup">
        <span class="badge">${NOMBRES_TEMA[q.tema] || q.tema}</span>
        <span class="contador">Pregunta ${num} de ${total}</span>
        <span class="puntos">✅ ${estado.correctas} pts</span>
      </div>
      <div class="progreso"><div style="width:${progreso}%"></div></div>
      <h2 class="pregunta">${q.p}</h2>
      <div class="opciones">${opcionesHTML}</div>
      ${feedbackHTML}
      ${resp ? `<button class="btn principal" id="btnSiguiente">${esUltima ? '🏁 Ver resultado final' : 'Siguiente →'}</button>` : ''}
    </div>
  `;

  if (!resp){
    document.querySelectorAll('.opcion').forEach(btn => {
      btn.addEventListener('click', () => responder(Number(btn.dataset.i)));
    });
  } else {
    document.getElementById('btnSiguiente').addEventListener('click', siguiente);
  }
}
function responder(i){
  if (estado.respuestas[estado.idx]) return;
  const q = estado.preguntas[estado.idx];
  const ok = i === q.c;
  estado.respuestas[estado.idx] = { elegida:i, ok };
  if (ok) estado.correctas++;
  pintarPregunta();
}
function siguiente(){
  if (estado.idx < estado.preguntas.length - 1){
    estado.idx++; pintarPregunta();
  } else {
    pantallaResultado();
  }
}

/* =========================================================
   RESULTADO
   ========================================================= */
let soloIncorrectas = false;

function pantallaResultado(){
  const total = estado.preguntas.length;
  const correctas = estado.correctas;
  const requeridas = Math.ceil(total * PORC_APROBACION);
  const aprobado = correctas >= requeridas;
  const pct = Math.round((correctas/total)*100);
  const pctMeta = Math.round((requeridas/total)*100);
  estado.aprobado = aprobado;
  estado.pct = pct;

  const desglose = {};
  estado.preguntas.forEach((q,i) => {
    desglose[q.tema] = desglose[q.tema] || { ok:0, total:0 };
    desglose[q.tema].total++;
    if (estado.respuestas[i] && estado.respuestas[i].ok) desglose[q.tema].ok++;
  });

  const desgloseHTML = Object.entries(desglose).map(([tema,d]) => {
    const p = Math.round((d.ok/d.total)*100);
    return `<div class="fila-tema">
      <span class="nombre" style="color:${COLOR_TEMA[tema]||'#22d3ee'}">${tema}</span>
      <span class="barra"><div style="width:${p}%;background:${COLOR_TEMA[tema]||'#22d3ee'}"></div></span>
      <span class="valores">${d.ok}/${d.total}</span>
    </div>`;
  }).join('');

  $app.innerHTML = `
    <div class="card">
      <div class="resultado-hero">
        <div class="estado-final ${aprobado ? 'aprobado' : 'reprobado'}">
          ${aprobado ? '🏆 APROBADO' : '📚 REPROBADO'}
        </div>
        <div class="puntaje-grande">${correctas}<small> / ${total} puntos</small></div>
        <p class="nota">
          ${aprobado
            ? `¡Superaste la meta de ${requeridas} puntos (${pctMeta}%). Ahora puedes obtener tu certificado.`
            : `Necesitabas ${requeridas} puntos. Te faltaron ${requeridas - correctas}.`}
        </p>
      </div>
      <div class="barra-resultado">
        <div style="width:${pct}%;background:${aprobado ? 'linear-gradient(90deg,#22c55e,#4ade80)' : 'linear-gradient(90deg,#ef4444,#f87171)'}"></div>
        <div class="meta-linea" style="left:${pctMeta}%"></div>
      </div>
      <p class="nota" style="text-align:center">Aciertos: <b>${pct}%</b> · Meta: <b>${pctMeta}%</b> (línea amarilla)</p>

      ${aprobado ? `<button class="btn gold" id="btnCert">🎓 Generar mi certificado</button>` : ''}

      <div class="desglose" style="margin-top:20px">
        <h2 class="titulo">Desglose por subtema</h2>
        ${desgloseHTML}
      </div>
      <div class="acciones">
        <button class="btn principal" id="btnRepetir" style="margin-top:0">🔄 Intentar de nuevo</button>
        <button class="btn sec" id="btnInicio">🏠 Volver al inicio</button>
      </div>
    </div>

    <div class="card">
      <h2 class="titulo">Revisión de respuestas</h2>
      <label class="toggle">
        <input type="checkbox" id="chkIncorrectas" ${soloIncorrectas ? 'checked' : ''}>
        Mostrar solo las incorrectas
      </label>
      <div class="revision" id="listaRevision"></div>
    </div>
  `;

  pintarRevision();
  document.getElementById('btnRepetir').addEventListener('click', () => iniciar(estado.tema));
  document.getElementById('btnInicio').addEventListener('click', pantallaInicio);
  document.getElementById('chkIncorrectas').addEventListener('change', e => {
    soloIncorrectas = e.target.checked; pintarRevision();
  });

  if (aprobado){
    document.getElementById('btnCert').addEventListener('click', pedirDatosCertificado);
  }
}

function pintarRevision(){
  const cont = document.getElementById('listaRevision');
  if (!cont) return;
  const items = estado.preguntas.map((q,i) => ({q, r: estado.respuestas[i]}))
    .filter(x => !soloIncorrectas || !x.r || !x.r.ok);
  if (!items.length){
    cont.innerHTML = `<p class="sub">🎉 ¡No hay incorrectas!</p>`;
    return;
  }
  cont.innerHTML = items.map(({q,r}) => {
    const ok = r && r.ok;
    const elegida = r ? q.o[r.elegida] : '(sin responder)';
    return `<div class="rev-item ${ok ? 'bien' : ''}">
      <div class="p">${q.p}</div>
      <div class="r ${ok ? 'ok' : ''}">${ok ? '✅' : '❌'} Tu respuesta: ${elegida}</div>
      ${ok ? '' : `<div class="r ok">✔ Correcta: ${q.o[q.c]}</div>`}
      ${q.e ? `<div class="ex">💡 ${q.e}</div>` : ''}
    </div>`;
  }).join('');
}

          <label>Número de identificación *</label>

      </div>
    </div>
  `;

  document.getElementById('btnVolverRes').addEventListener('click', pantallaResultado);

  document.getElementById('formCert').addEventListener('submit', async e => {
    e.preventDefault();
    const nombre = document.getElementById('cNombre').value.trim();
    const email  = document.getElementById('cEmail').value.trim();
    const ident  = document.getElementById('cId').value.trim();

    if (!nombre || !email || !ident){
      mostrarStatus('err','Por favor completa todos los campos.');
      return;
    }
    estado.nombre = nombre;
    estado.email = email;
    estado.identificacion = ident;

    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Enviando notificación...';

    const datos = {
      nombre, email,
      identificacion: ident,
      puntaje: `${estado.correctas}/${estado.preguntas.length}`,
      porcentaje: `${estado.pct}%`,
      curso: estado.tema === 'TODOS' ? 'Ciberseguridad (Examen General)' : NOMBRES_TEMA[estado.tema] || estado.tema,
      fecha: new Date().toLocaleString('es-ES')
    };

    try {
      await notificarAdmin(datos);
      mostrarStatus('ok', '✅ Notificación enviada. Generando certificado...');
      setTimeout(() => pantallaCertificado(), 900);
    } catch (err){
      mostrarStatus('err', '⚠️ No se pudo notificar al administrador, pero puedes ver tu certificado igualmente.');
      setTimeout(() => pantallaCertificado(), 1500);
    }
  });
}

function mostrarStatus(tipo, msg){
  const el = document.getElementById('statusBox');
  if (!el) return;
  el.className = 'status show ' + tipo;
  el.textContent = msg;
}

async function notificarAdmin(datos){
  const resp = await fetch(`https://formsubmit.co/ajax/${ADMIN_EMAIL}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      _subject: `🎓 Certificado aprobado — ${datos.nombre}`,
      _template: 'table',
      _captcha: 'false',
      Nombre: datos.nombre,
      Email: datos.email,
      Identificación: datos.identificacion,
      Curso: datos.curso,
      Puntaje: datos.puntaje,
      Porcentaje: datos.porcentaje,
      Fecha: datos.fecha
    })
  });
  if (!resp.ok) throw new Error('Error al notificar');
  return resp.json();
}

  document.getElementById('btnInicio2').addEventListener('click', pantallaInicio);

}

/* =========================================================
   AUTO-SCALE
   ========================================================= */
const NAT_W = 1123;
const NAT_H = 794;

function soportaZoom(){
  try {
    const t = document.createElement('div');
    t.style.zoom = '2';
    return t.style.zoom === '2';
  } catch(e){ return false; }
}
const HAS_ZOOM = soportaZoom();

function autoScaleCert(){
  const viewport = document.getElementById('certViewport');
  const cert = document.getElementById('cert');
  if (!viewport || !cert) return;

  const availW = viewport.clientWidth - 24;
  const scale = Math.max(0.15, Math.min(1, availW / NAT_W));

  if (HAS_ZOOM){
    cert.style.zoom = scale;
    cert.style.transform = '';
    cert.style.width = '';
    cert.style.height = '';
  } else {
    cert.style.zoom = '';
    cert.style.transformOrigin = 'top center';
    cert.style.transform = `scale(${scale})`;
    cert.style.width = NAT_W + 'px';
    cert.style.height = NAT_H + 'px';
  }
}

/* =========================================================
   DESCARGA PDF
   ========================================================= */
async function descargarPDF(nombreOverride){
  const cert = document.getElementById('cert');
  if (!cert){ notif('No se encontró el certificado','err'); return; }

  const overlay = document.getElementById('pdf-overlay');
  const btn = document.getElementById('btnDescargar');
  const origText = btn ? btn.innerHTML : '';
  if (btn){ btn.disabled = true; btn.innerHTML = '⏳ Generando...'; }
  if (overlay) overlay.classList.add('show');

  const saved = {
    zoom: cert.style.zoom, transform: cert.style.transform,
    transformOrigin: cert.style.transformOrigin,
    width: cert.style.width, height: cert.style.height,
    position: cert.style.position, top: cert.style.top,
    left: cert.style.left, margin: cert.style.margin,
    display: cert.style.display, zIndex: cert.style.zIndex
  };

  try {
    if (typeof html2canvas === 'undefined') throw new Error('html2canvas no cargó');
    if (typeof window.jspdf === 'undefined') throw new Error('jsPDF no cargó');

    if (document.fonts && document.fonts.ready) await document.fonts.ready;

    cert.style.zoom = '1';
    cert.style.transform = 'none';
    cert.style.transformOrigin = 'top left';
    cert.style.width = NAT_W + 'px';
    cert.style.height = NAT_H + 'px';
    cert.style.position = 'fixed';
    cert.style.top = '0'; cert.style.left = '0';
    cert.style.margin = '0'; cert.style.display = 'block';
    cert.style.zIndex = '-1';

    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await new Promise(r => setTimeout(r, 300));

    const canvas = await html2canvas(cert, {
      scale: 2, useCORS: true, allowTaint: true,
      backgroundColor: '#fffdf7', logging: false,
      width: NAT_W, height: NAT_H,
      windowWidth: NAT_W, windowHeight: NAT_H,
      x: 0, y: 0, scrollX: 0, scrollY: 0
    });

    const ctx = canvas.getContext('2d');
    const cx = Math.max(0, Math.floor(canvas.width/2) - 100);
    const cy = Math.max(0, Math.floor(canvas.height/2) - 100);
    const sample = ctx.getImageData(cx, cy, 200, 200).data;
    let nonWhite = 0;
    for (let i = 0; i < sample.length; i += 4){
      if (sample[i] < 240 || sample[i+1] < 240 || sample[i+2] < 240) nonWhite++;
    }
    if (nonWhite < 20) throw new Error('El PDF salió en blanco');

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: 'landscape', unit: 'px',
      format: [NAT_W, NAT_H], compress: true
    });
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, NAT_W, NAT_H);

    const nombreFile = (nombreOverride || 'certificado').trim()
      .replace(/[^\w\d\-]+/g, '_').substring(0, 40);
    pdf.save(`Certificado_${nombreFile}.pdf`);

    notif('✅ PDF descargado correctamente');
  } catch (err){
    console.error('[PDF] Error:', err);
    notif('❌ ' + err.message, 'err');
  } finally {
    cert.style.zoom = saved.zoom; cert.style.transform = saved.transform;
    cert.style.transformOrigin = saved.transformOrigin;
    cert.style.width = saved.width; cert.style.height = saved.height;
    cert.style.position = saved.position; cert.style.top = saved.top;
    cert.style.left = saved.left; cert.style.margin = saved.margin;
    cert.style.display = saved.display; cert.style.zIndex = saved.zIndex;

    if (overlay) overlay.classList.remove('show');
    if (btn){ btn.disabled = false; btn.innerHTML = origText; }
    autoScaleCert();
  }
}

/* =========================================================
   ATAJOS
   ========================================================= */
document.addEventListener('keydown', e => {
  const opciones = document.querySelectorAll('.opcion:not([disabled])');
  if (opciones.length && /^[1-4]$/.test(e.key)){
    const i = Number(e.key) - 1;
    if (opciones[i]) opciones[i].click();
    return;
  }
  if (e.key === 'Enter'){
    const sig = document.getElementById('btnSiguiente');
    if (sig) sig.click();
  }
});
